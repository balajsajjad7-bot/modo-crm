<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(120% 120% at 50% 0%, #141926 0%, #0b0d12 60%);
    color: #e9edf6; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-app-region: drag;
  }
  .logo { font-size: 34px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, #6b5cff, #35c3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .status { font-size: 13px; color: #9aa6bd; min-height: 18px; text-align: center; padding: 0 24px; }
  .bar { width: 220px; height: 3px; border-radius: 3px; background: #1f2636; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, #6b5cff, #35c3ff); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
  <div class="logo">MODO</div>
  <div class="bar"><i></i></div>
  <div class="status" id="s">Starting…</div>
  <script>window.setStatus = (t) => { document.getElementById("s").textContent = t; };</script>
</body>
</html>
